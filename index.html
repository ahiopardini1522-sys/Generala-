<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10262b">
<meta name="description" content="La Generala para jugar con amigos, online o en un mismo celular.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Generala">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Generala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Una columna de celular: mesa oscura de fondo, planilla de papel en el medio, bandeja de dados arriba y una barra de acción pegada abajo. */
  --mesa:#10262b;
  --papel:#f3ebd6;
  --tinta:#1d3a8a;
  --marcador:#c63a2e;
  --resaltador:#f2b632;
  --carbon:#1a1a1f;
  --hoja:#14303a;
  --hoja-2:#0e242b;
  --linea:rgba(243,235,214,.14);
  --font-display:'Alfa Slab One','Rockwell','Georgia',serif;
  --font-body:'Barlow Semi Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% -10%,#1f4a53 0%,transparent 60%),radial-gradient(100% 60% at 50% 115%,#08161a 0%,transparent 70%),var(--mesa);color:var(--papel);font-family:var(--font-body);font-size:16px;line-height:1.3;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--resaltador);outline-offset:2px}
h1,h2,h3{text-wrap:balance;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;padding:22px 18px 30px;gap:18px}
.topline{display:flex}
.kicker{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,235,214,.7)}
.note{font-size:15px;color:rgba(243,235,214,.75)}
.h1{font-family:var(--font-display);font-size:34px;line-height:1.05}
.h2{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,235,214,.75);margin-bottom:8px}
.link{align-self:center;font-weight:600;font-size:16px;text-decoration:underline;text-underline-offset:4px;color:rgba(243,235,214,.85);padding:8px}

/* ---------- botones ---------- */
.btn{min-height:54px;border-radius:14px;padding:0 20px;font-weight:700;font-size:19px;letter-spacing:.01em;color:var(--carbon);background:var(--papel);box-shadow:0 4px 0 #a99d78;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #a99d78}
.btn.primary{background:var(--resaltador);box-shadow:0 4px 0 #94640a}
.btn.primary:active:not([disabled]){box-shadow:0 1px 0 #94640a}
.btn.tachar{background:var(--marcador);color:#fff;box-shadow:0 4px 0 #741d15}
.btn.tachar:active:not([disabled]){box-shadow:0 1px 0 #741d15}
.btn.ghost{background:transparent;color:var(--papel);box-shadow:inset 0 0 0 2px rgba(243,235,214,.32)}
.btn.ghost:active:not([disabled]){box-shadow:inset 0 0 0 2px rgba(243,235,214,.32)}
.btn.ghost-dark{background:transparent;color:var(--carbon);box-shadow:inset 0 0 0 2px rgba(26,26,31,.3)}
.btn.small{min-height:44px;font-size:16px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn small{font-size:14px;opacity:.7;font-weight:600}
.grow{flex:1;min-width:0}

/* ---------- inicio ---------- */
.logo{font-family:var(--font-display);font-weight:400;font-size:clamp(46px,16vw,78px);line-height:.95;text-shadow:0 5px 0 #06141a}
.hero{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2.4vw,12px);padding:6px 2px 12px}
.hero .die:nth-child(1){transform:rotate(-5deg)}
.hero .die:nth-child(2){transform:rotate(3deg) translateY(-3px)}
.hero .die:nth-child(3){transform:rotate(-2deg) translateY(2px)}
.hero .die:nth-child(4){transform:rotate(5deg) translateY(-2px)}
.hero .die:nth-child(5){transform:rotate(-4deg)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,235,214,.75)}
.input{width:100%;height:54px;border-radius:12px;border:2px solid rgba(243,235,214,.25);background:rgba(0,0,0,.25);padding:0 14px;font-size:20px;font-weight:600;color:var(--papel)}
.input::placeholder{color:rgba(243,235,214,.35);font-weight:500}
.input:focus{border-color:var(--resaltador);outline:none}
.stack{display:flex;flex-direction:column;gap:12px}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:10px}
.code-in{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:400}

/* ---------- sala y jugadores ---------- */
.codeblock{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.code{display:flex;gap:8px}
.code span{width:clamp(48px,15vw,62px);height:clamp(64px,19vw,80px);display:grid;place-items:center;border-radius:12px;background:var(--papel);color:var(--tinta);font-family:var(--font-display);font-size:clamp(34px,11vw,46px);box-shadow:0 5px 0 #a99d78}
.plist{list-style:none;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:12px;background:rgba(243,235,214,.08);font-size:19px;font-weight:600}
.plist li.empty{color:rgba(243,235,214,.55);font-weight:500}
.plist .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:rgba(243,235,214,.14)}
.plist.inputs li{background:none;padding:0;min-height:0}
.plist.inputs .input{height:50px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--pc,var(--resaltador))}
.bt{width:44px;height:44px;border-radius:12px;font-size:22px;line-height:1;flex:none;background:rgba(243,235,214,.1);box-shadow:inset 0 0 0 2px rgba(243,235,214,.14);filter:grayscale(1);opacity:.7}
.bt.on{background:var(--resaltador);box-shadow:none;filter:none;opacity:1}
.plist.inputs .input:disabled{opacity:.9;font-style:italic}
.x{width:44px;height:44px;border-radius:12px;font-size:28px;line-height:1;color:rgba(243,235,214,.7);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:rgba(0,0,0,.28)}
.seg button{min-height:48px;border-radius:10px;font-weight:700;font-size:17px;color:rgba(243,235,214,.8)}
.seg button.on{background:var(--papel);color:var(--carbon);box-shadow:0 3px 0 #a99d78}
.waiting{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;font-weight:600;font-size:18px;color:rgba(243,235,214,.85);text-align:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--resaltador);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{50%{transform:scale(1.7);opacity:.4}}

/* ---------- partida ---------- */
.gtop{position:relative;display:flex;align-items:center;gap:4px;padding:6px 8px 0;min-height:48px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:rgba(243,235,214,.9);flex:none}
.gt{flex:1;text-align:center;line-height:1.1}
.gt b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.04em}
.gt small{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,235,214,.65)}
.turnbar{display:flex;align-items:center;gap:9px;padding:6px 16px 8px;font-size:18px;min-height:40px}
.turnbar b{font-weight:700}
#turnText{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.turnbar .rt{margin-left:auto;white-space:nowrap;font-size:15px;font-weight:500;color:rgba(243,235,214,.7)}
.tray{position:relative;margin:0 10px 8px;padding:14px 12px 22px;border-radius:18px;background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.18));box-shadow:inset 0 3px 8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.05)}
.dice{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2.4vw,12px)}

/* dados */
.die{position:relative;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:100%;aspect-ratio:1;padding:13%;border-radius:17%;background:radial-gradient(130% 130% at 28% 18%,#fffef6 0%,#fbf6e6 48%,#e9e0c4 100%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.85),0 5px 0 #b3a67f,0 9px 12px rgba(0,0,0,.4);transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s}
.die:disabled{cursor:default}
.die i{display:block;place-self:center;width:76%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4b4b54,var(--carbon) 62%);visibility:hidden}
.die[data-v="1"] i:nth-child(5),
.die[data-v="2"] i:nth-child(1),.die[data-v="2"] i:nth-child(9),
.die[data-v="3"] i:nth-child(1),.die[data-v="3"] i:nth-child(5),.die[data-v="3"] i:nth-child(9),
.die[data-v="4"] i:nth-child(1),.die[data-v="4"] i:nth-child(3),.die[data-v="4"] i:nth-child(7),.die[data-v="4"] i:nth-child(9),
.die[data-v="5"] i:nth-child(1),.die[data-v="5"] i:nth-child(3),.die[data-v="5"] i:nth-child(5),.die[data-v="5"] i:nth-child(7),.die[data-v="5"] i:nth-child(9),
.die[data-v="6"] i:nth-child(1),.die[data-v="6"] i:nth-child(3),.die[data-v="6"] i:nth-child(4),.die[data-v="6"] i:nth-child(6),.die[data-v="6"] i:nth-child(7),.die[data-v="6"] i:nth-child(9){visibility:visible}
.die[data-v="1"] i:nth-child(5){width:118%;background:radial-gradient(circle at 35% 30%,#e8776a,var(--marcador) 65%)}
.die.empty{background:rgba(0,0,0,.18);box-shadow:none;outline:2px dashed rgba(243,235,214,.22);outline-offset:-2px}
.die.held{transform:translateY(-9px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.85),0 0 0 3px var(--resaltador),0 16px 12px rgba(0,0,0,.35)}
.die.held::after{content:"";position:absolute;left:28%;right:28%;bottom:-17px;height:5px;border-radius:3px;background:var(--resaltador)}
.die.rolling:not(.r3d){animation:tumble .5s ease-in-out}
/* dado 3D: el cubo solo existe mientras el dado rueda; en reposo se ve el dado plano de siempre */
.die .stage{display:none;position:absolute;inset:0;perspective:calc(var(--h,31px)*7);pointer-events:none}
.die.r3d{background:none;box-shadow:0 9px 12px rgba(0,0,0,.28)}
.die.r3d>i{visibility:hidden!important}
.die.r3d .stage{display:block}
.cube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.cube .f{position:absolute;inset:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;border-radius:17%;background:radial-gradient(130% 130% at 28% 18%,#fffef6 0%,#fbf6e6 48%,#e9e0c4 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
@property --shade{syntax:'<number>';inherits:true;initial-value:1}
.cube .f::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--sh,transparent);opacity:var(--shade)}
.cube .f1{transform:translateZ(var(--h,31px))}
.cube .f6{transform:rotateY(180deg) translateZ(var(--h,31px));--sh:rgba(40,30,0,.1)}
.cube .f2{transform:rotateX(90deg) translateZ(var(--h,31px))}
.cube .f5{transform:rotateX(-90deg) translateZ(var(--h,31px));--sh:rgba(40,30,0,.24)}
.cube .f3{transform:rotateY(90deg) translateZ(var(--h,31px));--sh:rgba(40,30,0,.12)}
.cube .f4{transform:rotateY(-90deg) translateZ(var(--h,31px));--sh:rgba(40,30,0,.18)}
.cube b{display:block;place-self:center;width:76%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4b4b54,var(--carbon) 62%)}
.cube .f1 b{width:118%;background:radial-gradient(circle at 35% 30%,#e8776a,var(--marcador) 65%)}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(130deg)}62%{transform:translateY(0) rotate(250deg)}82%{transform:translateY(-5px) rotate(335deg)}100%{transform:translateY(0) rotate(360deg)}}
.stampbox{position:absolute;left:0;right:0;top:-26px;display:flex;justify-content:center;pointer-events:none;z-index:4}
.stampbox span{font-family:var(--font-display);font-size:clamp(18px,5.6vw,24px);line-height:1;color:var(--marcador);background:rgba(251,246,230,.96);border:3px solid var(--marcador);border-radius:8px;padding:5px 12px;transform:rotate(-4deg);box-shadow:0 4px 0 rgba(0,0,0,.25);animation:slam .45s cubic-bezier(.2,1.5,.4,1) both;text-align:center;white-space:nowrap}
@keyframes slam{from{opacity:0;transform:rotate(-4deg) scale(2)}to{opacity:1;transform:rotate(-4deg) scale(1)}}

/* planilla: anotador oscuro, como pizarra con tiza */
.sheetwrap{flex:1;min-height:0;overflow:auto;margin:6px 10px 10px;border-radius:12px;background:var(--hoja);color:var(--papel);box-shadow:0 0 0 1px rgba(243,235,214,.12),0 8px 22px rgba(0,0,0,.4);overscroll-behavior:contain}
/* los tamaños se ajustan a la cantidad de jugadores: con pocos, todo se lee más grande */
.sheet{--ink:25px;--ghost:23px;--nm:16px;--tot:25px;border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;height:100%;font-variant-numeric:tabular-nums}
.sheet[data-np="1"],.sheet[data-np="2"]{--ink:31px;--ghost:28px;--nm:20px;--tot:31px}
.sheet[data-np="3"]{--ink:28px;--ghost:25px;--nm:18px;--tot:28px}
.sheet th,.sheet td{height:38px;padding:0;text-align:center;position:relative;border-bottom:1px solid var(--linea);border-right:1px solid rgba(243,235,214,.07);font-weight:600}
.sheet thead th{position:sticky;top:0;z-index:3;height:48px;background:var(--hoja-2);border-top:4px solid var(--pc,#999);border-bottom:2px solid rgba(243,235,214,.22);line-height:1.05}
.sheet th.lab{position:sticky;left:0;z-index:2;text-align:left;padding:0 3px 0 9px;background:var(--hoja-2);border-right:2px solid rgba(255,122,107,.5)}
.sheet thead th.lab{z-index:5;border-top-color:transparent}
.sheet th.lab .lt{display:block;font-weight:700;font-size:17px;line-height:1}
.sheet th.lab .lt.num{font-family:var(--font-display);font-weight:400;font-size:23px;color:var(--papel)}
.sheet th.lab small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-top:2px}
.sheet td.act{background:rgba(242,182,50,.13)}
.sheet thead th.act{background:var(--resaltador);color:var(--carbon)}
.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;font-weight:700;font-size:var(--nm)}
.nm small{display:block;font-size:11px;font-weight:600;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
.sheet td.gone,.sheet th.gone{opacity:.45}
/* cada jugador anota con su color */
.sheet td.done::before{content:"";position:absolute;inset:4px 5px;border-radius:9px;background:rgba(var(--pcr,243,235,214),.36);border:1px solid rgba(var(--pcr,243,235,214),.75)}
.sheet td.done.cruz::before{background:rgba(255,122,107,.14);border-color:rgba(255,122,107,.4)}
.sheet td.done.last::before{background:rgba(242,182,50,.24);border:2px solid var(--resaltador);box-shadow:0 0 0 3px rgba(242,182,50,.28)}
/* números a tiza */
.ink{position:relative;z-index:1;display:inline-block;font-size:var(--ink);font-weight:700;line-height:1;color:#f8f2de;transform:rotate(var(--r,0deg));text-shadow:0 0 .7px rgba(248,242,222,.9),0 1px 0 rgba(0,0,0,.28);filter:url(#chalk)}
.sheet td.done.last .ink{color:#fff}
.sheet td.done .cellbtn{z-index:2}
.sheet td.done.rep::before{border:2px dashed #ffb347;background:rgba(255,179,71,.16)}
.sheet td.done.rep::after{content:"=";position:absolute;top:3px;right:8px;z-index:1;font-size:14px;font-weight:800;line-height:1;color:#ffb347}
.sheet td.done.rep.mine::before{animation:repPulse 1.6s ease-in-out infinite}
@keyframes repPulse{50%{box-shadow:0 0 0 3px rgba(255,179,71,.4)}}
.sheet td.done.cut::before{background:rgba(255,122,107,.16);border:1px solid rgba(255,122,107,.5)}
.sheet td.done.cut .ink{opacity:.45}
.tachado.over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68%;height:62%}
/* puntos posibles en tu turno: los que suman se ven bien marcados, los ceros quedan discretos */
.ghost{font-size:var(--ghost);font-weight:600;color:rgba(243,235,214,.58)}
.ghost.pos{position:relative;z-index:1;font-weight:800;color:#ffd778}
.ghost.zero{font-size:calc(var(--ghost)*.78);font-weight:600;color:rgba(243,235,214,.27)}
.cellbtn{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center}
.sheet td.open.pv .cellbtn::before{content:"";position:absolute;inset:4px 5px;border-radius:9px;background:rgba(242,182,50,.07);border:1.5px solid rgba(242,182,50,.72)}
.sheet td.pick{background:rgba(242,182,50,.3);box-shadow:inset 0 0 0 3px var(--resaltador)}
.sheet td.open.pv.pick .cellbtn::before{background:transparent;border-color:transparent}
.sheet td.pick .ghost{color:#fff;font-weight:800}
.sheet tr.sel th.lab{background:#554f26}
.tachado{position:relative;z-index:1;width:68%;height:62%;overflow:visible;vertical-align:middle}
.tachado path{fill:none;stroke:#ff7a6b;stroke-width:3.4;stroke-linecap:round}
.fresh .ink{animation:inkin .38s ease-out}
.fresh .tachado path{stroke-dasharray:46;stroke-dashoffset:46;animation:draw .36s .05s ease-out forwards}
@keyframes inkin{from{opacity:0;transform:scale(1.7) rotate(var(--r,0deg))}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
@keyframes draw{to{stroke-dashoffset:0}}
/* subtotales: números y juegos */
.sheet tr.sub>*{height:28px;border-bottom:1px solid var(--linea);background:rgba(0,0,0,.16);font-size:16px;font-weight:700;color:rgba(243,235,214,.82)}
.sheet tr.sub.first>*{border-top:2px solid rgba(243,235,214,.24)}
.sheet tr.sub th.lab{background:var(--hoja-2);font-size:14px;font-weight:600;color:rgba(243,235,214,.72)}
.sheet tr.sub td.z{color:rgba(243,235,214,.3)}
.sheet tr.sub td.act{background:rgba(242,182,50,.13)}
/* total: el que va ganando lleva corona; abajo, la diferencia con el primero */
.sheet tr.tot>*{position:sticky;bottom:0;z-index:2;height:58px;background:var(--hoja-2);border-top:2px solid rgba(243,235,214,.35);border-bottom:0;vertical-align:middle}
.sheet tr.tot th.lab{z-index:5;font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--papel)}
.sheet tr.tot td{--tvc:var(--papel);font-family:var(--font-display);font-weight:400;font-size:var(--tot);color:var(--tvc);border-top:3px solid var(--pc,rgba(243,235,214,.35));background:linear-gradient(rgba(var(--pcr,243,235,214),.17),rgba(var(--pcr,243,235,214),.17)),var(--hoja-2)}
.sheet tr.tot td.act{--tvc:var(--carbon);background:var(--resaltador)}
.sheet tr.tot td.lead:not(.act){--tvc:#ffe08a}
.sheet .tv{display:block;position:relative;height:32px;line-height:32px;color:var(--tvc)}
.sheet .tv.cnt{color:transparent;animation:totpop .75s .22s cubic-bezier(.2,1.4,.4,1) backwards}
.sheet .tv.cnt::after{content:attr(data-show);position:absolute;inset:0;color:var(--tvc)}
@keyframes totpop{0%{transform:scale(1)}25%{transform:scale(1.2)}100%{transform:scale(1)}}

<script>
(function(){
'use strict';

/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={
  get(k){try{return localStorage.getItem('generala:'+k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem('generala:'+k,v)}catch(e){}},
  del(k){try{localStorage.removeItem('generala:'+k)}catch(e){}}
};
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
// Igual que db.update: los objetos se fusionan, todo lo demás (arrays incluidos) se reemplaza.
function merge(a,b){
  const out=Object.assign({},a);
  for(const k of Object.keys(b)){
    const bv=b[k];
    out[k]=isObj(bv)?merge(isObj(out[k])?out[k]:{},bv):bv;
  }
  return out;
}
function randInt(n){
  try{
    const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
    let x;
    do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);
    return x%n;
  }catch(e){return Math.floor(Math.random()*n)}
}
const rollDie=()=>randInt(6)+1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=randInt(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}
function hash(s){let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x}
const REDUCED=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>window.__genCode?window.__genCode():Array.from({length:4},()=>ALPHABET[randInt(ALPHABET.length)]).join('');

/* ================= reglas ================= */
const CATS=[
  {k:'n1',t:'1',n:'el 1'},{k:'n2',t:'2',n:'el 2'},{k:'n3',t:'3',n:'el 3'},
  {k:'n4',t:'4',n:'el 4'},{k:'n5',t:'5',n:'el 5'},{k:'n6',t:'6',n:'el 6'},
  {k:'esc',t:'Escalera',h:'20 · 25',n:'Escalera'},
  {k:'ful',t:'Full',h:'30 · 35',n:'Full'},
  {k:'pok',t:'Póker',h:'40 · 45',n:'Póker'},
  {k:'gen',t:'Generala',h:'50',n:'Generala'},
  {k:'gdo',t:'Doble',h:'100',n:'Generala doble'}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const COLORS=['#2d5be3','#d23b2a','#1f8f5f','#7b46c9','#e08a1e','#0e8fa6'];
const COLORS_RGB=COLORS.map(h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(','));
const CNT_MS=750,CNT_DELAY=220;
const MAX_PLAYERS=4;
const NO_HOLD=()=>[false,false,false,false,false];

function counts(d){const c=[0,0,0,0,0,0,0];for(const v of d)c[v]++;return c}
function isGenerala(d){return d.length===5&&d[0]>0&&d.every(v=>v===d[0])}
function isPoker(d){return d.length===5&&d[0]>0&&counts(d).some(x=>x>=4)}
function isFull(d){if(d.length!==5||!d[0])return false;const c=counts(d).filter(x=>x>0).sort((a,b)=>a-b);return c.length===2&&c[0]===2&&c[1]===3}
function isEsc(d){if(d.length!==5||!d[0])return false;const s=[...new Set(d)].sort((a,b)=>a-b).join('');return s==='12345'||s==='23456'||s==='13456'}
function potentials(d,roll,sheet,opts){
  const out={};
  if(!d||d.length!==5||!d[0]||roll<1)return out;
  const c=counts(d),first=roll===1,o=opts||{};
  const set=(k,v)=>{if(sheet[k]===undefined)out[k]=v};
  for(let n=1;n<=6;n++)set('n'+n,c[n]*n);
  set('esc',isEsc(d)?(first?25:20):0);
  set('ful',isFull(d)?(first?35:30):0);
  set('pok',isPoker(d)?(first?45:40):0);
  set('gen',isGenerala(d)?(first&&o.servida==='60'?60:50):0);
  set('gdo',isGenerala(d)&&sheet.gen>0?100:0);
  return out;
}
function comboName(d,roll){
  if(!d||d.length!==5||!d[0])return '';
  const f=roll===1;
  if(isGenerala(d))return f?'Generala servida':'Generala';
  if(isPoker(d))return f?'Póker servido':'Póker';
  if(isFull(d))return f?'Full servido':'Full';
  if(isEsc(d))return f?'Escalera servida':'Escalera';
  return '';
}
const sheetOf=(g,p)=>(g.sheets&&g.sheets[p])||{};
const filled=sh=>CATS.reduce((n,c)=>n+(sh[c.k]!==undefined?1:0),0);
const total=sh=>CATS.reduce((s,c)=>s+(sh[c.k]||0),0);
const isGone=(g,p)=>!!(g.gone&&g.gone[p]);
const botIs=(g,p)=>!!(g&&g.bots&&g.bots[p]);
const alive=g=>g.order.filter(p=>!isGone(g,p));
const allDone=g=>alive(g).every(p=>filled(sheetOf(g,p))>=CATS.length);
const activeOf=g=>g.order[g.turn];
// Valores repetidos: cuando todos anotaron una casilla, los que tienen el mismo valor (mayor que 0) se tachan.
function catComplete(g,k){const al=alive(g);return al.length>0&&al.every(p=>sheetOf(g,p)[k]!==undefined)}
function repeatedIn(g,k){
  const out=new Set();
  if(!catComplete(g,k))return out;
  const by={};
  alive(g).forEach(p=>{const v=sheetOf(g,p)[k];if(v>0)(by[v]=by[v]||[]).push(p)});
  Object.keys(by).forEach(v=>{if(by[v].length>1)by[v].forEach(p=>out.add(p))});
  return out;
}
function nextTurn(g){
  const n=g.order.length;
  for(let s=1;s<=n;s++){
    const i=(g.turn+s)%n,p=g.order[i];
    if(!isGone(g,p)&&filled(sheetOf(g,p))<CATS.length)return i;
  }
  return g.turn;
}
function winnersOf(g){
  const al=alive(g);let best=-1;
  al.forEach(p=>{best=Math.max(best,total(sheetOf(g,p)))});
  return al.filter(p=>total(sheetOf(g,p))===best);
}
function actRoll(g,held){
  const roll=g.roll||0;
  if(roll>=3)return null;
  const prev=(g.dice&&g.dice.length===5)?g.dice:[0,0,0,0,0];
  const keep=roll===0?NO_HOLD():(held||NO_HOLD()).slice();
  if(roll>0&&keep.every(Boolean))return null;
  const dice=prev.map((v,i)=>(roll>0&&keep[i]&&v)?v:rollDie());
  const patch={dice,held:keep,roll:roll+1,seq:(g.seq||0)+1};
  if(roll===0&&isGenerala(dice)&&g.opts&&g.opts.servida==='win'){
    patch.status='finished';patch.winners=[activeOf(g)];patch.endReason='servida';
  }
  return patch;
}
function actScore(g,k){
  const p=activeOf(g),sh=sheetOf(g,p);
  if(sh[k]!==undefined)return null;
  const pot=potentials(g.dice||[],g.roll||0,sh,g.opts||{});
  if(pot[k]===undefined)return null;
  const v=pot[k];
  const patch={sheets:{[p]:{[k]:v}},roll:0,dice:[],held:NO_HOLD(),evt:{n:((g.evt&&g.evt.n)||0)+1,pid:p,k,v}};
  const g2=merge(g,patch);
  if(allDone(g2)){patch.status='finished';patch.winners=winnersOf(g2);patch.endReason='full'}
  else patch.turn=nextTurn(g2);
  return patch;
}
function actRemove(g,p){
  const patch={gone:{[p]:true}};
  const g2=merge(g,patch);
  if(!alive(g2).length)return null;
  if(allDone(g2)){patch.status='finished';patch.winners=winnersOf(g2);patch.endReason='full'}
  else if(activeOf(g)===p){patch.roll=0;patch.dice=[];patch.held=NO_HOLD();patch.turn=nextTurn(g2)}
  return patch;
}
function newGameDoc(g,winners){
  const order=alive(g);
  const rot=order.length>1?order.slice(1).concat(order[0]):order;
  const names={};rot.forEach(p=>{names[p]=(g.names&&g.names[p])||'?'});
  // partidas ganadas: se arrastran de revancha en revancha (los empatados suman los dos)
  const series=Object.assign({},g.series||{});
  (winners||[]).forEach(p=>{series[p]=(series[p]||0)+1});
  const doc={code:g.code||null,hostId:g.hostId||null,status:'playing',opts:g.opts||{servida:'win'},order:rot,names,gone:{},sheets:{},turn:0,roll:0,dice:[],held:NO_HOLD(),seq:0,evt:{n:0},winners:[],endReason:null,n:(g.n||1)+1,series};
  if(g.bots){doc.bots=g.bots;doc.botLevel=g.botLevel||'normal'}
  return doc;
}

/* ================= compu ================= */
// La compu mide cada jugada contra una "meta" por casilla (lo que suele valer dejarla abierta) y, mirando las
// tiradas que quedan, elige qué dados guardar. Juega solo con sus dados y su planilla: no hace trampa.
const BOT_PAR={n1:2.8,n2:5.6,n3:8.4,n4:11.2,n5:14,n6:16.8,esc:12,ful:14,pok:15,gen:10,gdo:2};
const botParOf=(k,sh)=>k==='gdo'?(sh.gen===0?0:(sh.gen>0?4:2)):BOT_PAR[k];
const Bot=(()=>{
  const fact=[1,1,2,6,24,120],pw=[1,6,36,216,1296,7776];
  const comps=n=>{ // todas las formas de repartir n dados entre las 6 caras
    const res=[];
    (function rec(i,left,cur){
      if(i===5){cur[5]=left;res.push(cur.slice());return}
      for(let x=0;x<=left;x++){cur[i]=x;rec(i+1,left-x,cur)}
    })(0,n,[0,0,0,0,0,0]);
    return res;
  };
  const codeOf=c=>c.reduce((s,n,i)=>s+n*pw[i],0);
  const OUT=[0,1,2,3,4,5].map(k=>comps(k).map(c=>({code:codeOf(c),p:fact[k]/c.reduce((f,n)=>f*fact[n],1)/Math.pow(6,k)})));
  const STATES=comps(5).map(c=>({c,code:codeOf(c)}));
  const holdsMemo=new Map();
  const holds=s=>{ // qué se puede guardar de un estado: sub-conjuntos de sus dados
    let r=holdsMemo.get(s.code);
    if(r)return r;
    r=[];
    (function rec(i,cur,n){
      if(i===6){r.push({h:cur.slice(),code:codeOf(cur),k:5-n});return}
      for(let x=0;x<=s.c[i];x++){cur[i]=x;rec(i+1,cur,n+x)}
    })(0,[0,0,0,0,0,0],0);
    holdsMemo.set(s.code,r);
    return r;
  };
  const diceOf=c=>{const d=[];c.forEach((n,i)=>{for(let j=0;j<n;j++)d.push(i+1)});return d};
  let memoKey='',memo=null;
  const tables=(sheet,opts)=>{
    const key=JSON.stringify([sheet,opts&&opts.servida]);
    if(key===memoKey)return memo;
    const V0=new Float64Array(46656),W1=new Float64Array(46656);
    const best=(d,roll)=>{
      const pot=potentials(d,roll,sheet,opts||{});
      let v=-1e9,k=null;
      for(const c in pot){const x=pot[c]-botParOf(c,sheet);if(x>v){v=x;k=c}}
      return {v,k};
    };
    STATES.forEach(s=>{V0[s.code]=best(diceOf(s.c),2).v});
    STATES.forEach(s=>{
      let w=V0[s.code];
      holds(s).forEach(h=>{
        if(h.k===0)return;
        let e=0;OUT[h.k].forEach(o=>{e+=o.p*V0[h.code+o.code]});
        if(e>w)w=e;
      });
      W1[s.code]=w;
    });
    memoKey=key;memo={V0,W1,best};
    return memo;
  };
  // dice: los 5 dados; roll: tirada que acaba de salir (1 a 3); devuelve qué hacer
  function plan(dice,roll,sheet,opts){
    const T=tables(sheet,opts);
    const stop=T.best(dice,roll);
    if(roll>=3||stop.k===null)return {act:'score',k:stop.k};
    const c=[0,0,0,0,0,0];dice.forEach(v=>{c[v-1]++});
    const next=roll===1?T.W1:T.V0;
    let bestV=stop.v,bestH=null;
    holds({c,code:codeOf(c)}).forEach(h=>{
      if(h.k===0)return;
      let e=0;OUT[h.k].forEach(o=>{e+=o.p*next[h.code+o.code]});
      if(e>bestV+1e-9){bestV=e;bestH=h}
    });
    if(!bestH)return {act:'score',k:stop.k};
    const left=bestH.h.slice();
    return {act:'roll',hold:dice.map(v=>{if(left[v-1]>0){left[v-1]--;return true}return false})};
  }
  // nivel fácil: guarda lo que más se repite y anota lo que más suma
  function planEasy(dice,roll,sheet,opts){
    const pot=potentials(dice,roll,sheet,opts||{});
    let pk=null,pv=-1;
    Object.keys(pot).forEach(c=>{if(pot[c]>pv||(pot[c]===pv&&botParOf(c,sheet)<botParOf(pk,sheet))){pv=pot[c];pk=c}});
    if(roll>=3||pk===null||isGenerala(dice)||isPoker(dice)||isFull(dice)||isEsc(dice))return {act:'score',k:pk};
    const n=[0,0,0,0,0,0,0];dice.forEach(v=>{n[v]++});
    let face=1;for(let v=2;v<=6;v++)if(n[v]>=n[face])face=v;
    if(n[face]<2)face=Math.max(...dice);
    let kept=false;
    return {act:'roll',hold:dice.map(v=>{if(v===face&&(n[face]>=2||!kept)){kept=true;return true}return false})};

// Tachados por repetido: en una sala cada uno guarda los suyos en su propio documento (así no se pisan entre celulares);
// en un solo celular van dentro de la partida.
function cutsOf(g,p){
  if(ui.mode==='local')return (g.cuts&&g.cuts[p])||{};
  const d=Net.cuts[p];
  return (d&&d.n===(g.n||0)&&d.cut)?d.cut:{};
}
// la compu tacha sola sus valores repetidos: no hace falta que nadie los toque
const isCut=(g,p,k)=>!!cutsOf(g,p)[k]||(ui.mode==='local'&&botIs(g,p)&&repeatedIn(g,k).has(p));
// puntos de números (1 al 6) y de juegos, sin contar los valores tachados por repetidos
function partsOf(g,p){
  const sh=sheetOf(g,p);let nums=0,jue=0;
  CATS.forEach(c=>{
    const v=sh[c.k];
    if(v>0&&!isCut(g,p,c.k)){if(c.k[0]==='n')nums+=v;else jue+=v}
  });
  return {nums,jue};
}
function pointsOf(g,p){const t=partsOf(g,p);return t.nums+t.jue}
// quién va ganando: lead = los que van primeros (si empatan, todos); gap = ventaja del único líder sobre el segundo
function standing(g){
  if(!g||g.status==='lobby'||!g.order)return null;
  const al=alive(g);
  if(!al.length)return null;
  if(g.endReason==='servida'){
    const w=(g.winners||[]).filter(p=>al.includes(p));
    return w.length?{lead:new Set(w),pts:{},best:0,gap:null,diff:false}:null;
  }
  const pts={};al.forEach(p=>{pts[p]=pointsOf(g,p)});
  const best=Math.max(...al.map(p=>pts[p]));
  if(best<=0)return null;
  const lead=new Set(al.filter(p=>pts[p]===best));
  let second=-1;al.forEach(p=>{if(!lead.has(p))second=Math.max(second,pts[p])});
  return {lead,pts,best,gap:second<0?null:best-second,diff:true};
}
function canCut(g,p){
  if(!g||g.status==='lobby'||g.endReason==='servida')return false;
  if(ui.mode==='local')return !botIs(g,p);
  return !ui.spectator&&p===me.pid;
}
function pendingReps(g){
  let n=0;
  CATS.forEach(c=>{repeatedIn(g,c.k).forEach(p=>{
    if(isCut(g,p,c.k))return;
    if(ui.mode==='online'&&p!==me.pid)return;
    n++;
  })});
  return n;
}
function winnersNow(g){
  if(g.endReason==='servida')return g.winners||[];
  const al=alive(g);let best=-1;
  al.forEach(p=>{best=Math.max(best,pointsOf(g,p))});
  return al.filter(p=>pointsOf(g,p)===best);
}

// Sonido de dados: se genera en el celular, no hay archivos.
const Sound={
  ctx:null,noise:null,on:store.get('sound')!=='off',
  unlock(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC()}
      if(this.ctx.state==='suspended'&&this.ctx.resume){const r=this.ctx.resume();if(r&&r.catch)r.catch(()=>{})}
    }catch(e){}
  },
  buffer(){
    if(this.noise)return this.noise;
    const c=this.ctx,b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return (this.noise=b);
  },
  // Sonidos cortos de aviso: también se generan con notas, sin archivos.
  _go(fn){
    if(!this.on)return;
    try{
      this.unlock();
      const c=this.ctx;
      if(!c||c.state==='closed')return;
      const out=c.createGain();out.gain.value=0.6;out.connect(c.destination);
      fn(c,out,c.currentTime+0.02);
    }catch(e){}
  },
  note(c,out,t,f,d,g,type){
    const o=c.createOscillator(),e=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    e.gain.setValueAtTime(0.0001,t);
    e.gain.exponentialRampToValueAtTime(g,t+0.012);
    e.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(e);e.connect(out);o.start(t);o.stop(t+d+0.03);
  },
  score(v){ // al anotar: más notas cuanto más vale; al tachar, un tono grave que baja
    this._go((c,out,t)=>{
      if(!(v>0)){
        const o=c.createOscillator(),e=c.createGain();
        o.type='triangle';o.frequency.setValueAtTime(250,t);o.frequency.exponentialRampToValueAtTime(110,t+0.26);
        e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(0.42,t+0.015);e.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
        o.connect(e);e.connect(out);o.start(t);o.stop(t+0.37);
        return;
      }
      const up=v>=40?[523.25,659.25,783.99,1046.5]:v>=20?[523.25,659.25,783.99]:[587.33,880];
      up.forEach((f,i)=>this.note(c,out,t+i*0.07,f,i===up.length-1?0.38:0.2,0.4,'triangle'));
    });
  },
  generala(){ // cuando los cinco dados salen iguales
    this._go((c,out,t)=>{
      [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>this.note(c,out,t+i*0.08,f,0.5,0.28,'triangle'));
      [1046.5,1318.5,1568].forEach(f=>this.note(c,out,t+0.45,f,0.9,0.2,'sine'));
    });
  },
  win(){ // fanfarria al terminar la partida
    this._go((c,out,t)=>{
      [392,523.25,659.25,783.99].forEach((f,i)=>this.note(c,out,t+i*0.11,f,0.22,0.3,'triangle'));
      [523.25,659.25,783.99,1046.5].forEach(f=>this.note(c,out,t+0.52,f,1.2,0.2,'triangle'));
    });
  },
  end(){ // fin de partida para quien no ganó: suave
    this._go((c,out,t)=>{
      this.note(c,out,t,440,0.35,0.4,'sine');
      this.note(c,out,t+0.2,329.63,0.5,0.4,'sine');
    });
  },
  turn(){ // "ding-dong" ascendente: te toca
    this._go((c,out,t)=>{
      [[659.25,0],[880,0.16]].forEach(([f,d])=>{
        this.note(c,out,t+d,f,0.55,0.4,'sine');
        this.note(c,out,t+d,f*2,0.3,0.14,'sine');
      });
    });
  },
  react(){ // un "pop" suave cuando otro reacciona
    this._go((c,out,t)=>{
      this.note(c,out,t,740,0.09,0.3,'sine');
      this.note(c,out,t+0.07,988,0.14,0.26,'sine');
    });
  },
  roll(n,ms){ // ms: cuánto tardan los dados en aterrizar; el golpe final cae justo ahí
    if(!this.on)return;
    try{
      this.unlock();
      const c=this.ctx;
      if(!c||c.state==='closed')return;
      const out=c.createGain();out.gain.value=0.6;out.connect(c.destination);
      const t0=c.currentTime+0.01;
      const thump=(t,f,g,d)=>{const o=c.createOscillator(),e=c.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.7,t);o.frequency.exponentialRampToValueAtTime(f,t+d);e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(e);e.connect(out);o.start(t);o.stop(t+d+0.02)};

      thump(t0,130,0.3,0.1);
      const hits=Math.round(3+Math.max(1,Math.min(5,n||1))*1.6);
      const avg=ms>0?Math.max(0.025,(0.88*ms/1000-0.09)/hits):0.05;
      let t=t0+0.05;
      for(let i=0;i<hits;i++){t+=avg*(0.6+Math.random()*0.8);hit(t,1500+Math.random()*2800,0.12+Math.random()*0.2)}
      thump(t+0.04,95,0.28,0.13);hit(t+0.04,900,0.25);
    }catch(e){}
  }
};

const SHADE_OK=!!(window.CSS&&CSS.registerProperty);
const rnd=(a,b)=>a+Math.random()*(b-a);   // solo adorno: no usa el azar de los dados
function tumble(el,getFinal,ms){
  if(el._tumbleCancel)el._tumbleCancel();
  el._rolling=true;el.classList.add('rolling');
  let over=false,timer=0,anims=[];
  const cleanup=()=>{
    clearTimeout(timer);clearInterval(timer);
    anims.forEach(a=>{try{a.cancel()}catch(e){}});anims=[];
    el.classList.remove('rolling','r3d');
    el._tumbleCancel=null;
  };
  const done=()=>{if(over)return;over=true;cleanup();el._rolling=false;setFace(el,getFinal())};
  el._tumbleCancel=()=>{if(over)return;over=true;cleanup();el._rolling=false};
  if(REDUCED){timer=setTimeout(done,0);return}
  const cube=el.querySelector('.cube'),fin=getFinal()||1,end=CUBE_END[fin];
  if(!cube||!cube.animate||!end){   // sin animaciones modernas: se mezclan las caras del dado plano
    let t=0;
    timer=setInterval(()=>{if(t++>=7)done();else setFace(el,1+Math.floor(Math.random()*6))},70);
    return;
  }
  const dur=Math.round((ms||600)+Math.random()*50),h=Math.max(10,el.offsetWidth/2);
  el.style.setProperty('--h',h+'px');
  el.classList.add('r3d');
  const sgn=()=>Math.random()<.5?-1:1;
  const kx=sgn()*(Math.random()<.4?1:0),ky=sgn()*(Math.random()<.5?1:2);
  const T=(x,y)=>`translateZ(${-h}px) rotateX(${x}deg) rotateY(${y}deg)`;
  const sx=rnd(-180,180),sy=rnd(-180,180);
  const ex=end[0]+kx*360,ey=end[1]+ky*360;
  // las caras laterales van sombreadas mientras gira; al aterrizar la sombra se apaga para que coincida con el dado plano
  const sh=SHADE_OK?v=>({'--shade':v}):()=>({});
  const cubeAnim=cube.animate([
    Object.assign({transform:T(sx,sy),offset:0},sh(1)),
    Object.assign({offset:.5},sh(1)),
    {transform:T(sx+(ex-sx)*.72+rnd(-14,14),sy+(ey-sy)*.72+rnd(-14,14)),offset:.72},
    Object.assign({transform:T(ex,ey),offset:1},sh(0))
  ],{duration:dur,easing:'cubic-bezier(.2,.65,.3,1)',fill:'both'});
  anims.push(cubeAnim);
  try{ // el salto del dado entero (translate y scale se suman al giro propio del dado, como en la portada)
    anims.push(el.animate([
      {translate:'0 0',scale:'1',offset:0},
      {translate:'0 -20px',scale:'1.13',offset:.34},
      {translate:'0 0',scale:'1',offset:.7},
      {translate:'0 -5px',scale:'1.03',offset:.85},
      {translate:'0 0',scale:'1',offset:1}
    ],{duration:dur,easing:'ease-in-out'}));
  }catch(e){}
  cubeAnim.onfinish=done;
  timer=setTimeout(done,dur+160);
}

// Iguala los atributos de un elemento con los de otro
function syncAttrs(o,n){
  [...o.attributes].forEach(a=>{if(!n.hasAttribute(a.name))o.removeAttribute(a.name)});
  [...n.attributes].forEach(a=>{if(o.getAttribute(a.name)!==a.value)o.setAttribute(a.name,a.value)});
}
// Actualiza la planilla tocando solo las casillas que cambiaron: el resto sigue siendo el mismo elemento,
// así no parpadea, no se vuelve a dibujar la tiza y no se reinician las animaciones.
function patchSheet(el,html){
  const full=()=>{
    el.innerHTML=html;
    el.querySelectorAll('th,td').forEach(c=>{c.__i=c.innerHTML;c.__o=c.outerHTML});
  };
  const nt=document.createElement('table');
  nt.innerHTML=html;
  const ocg=el.querySelector('colgroup'),ncg=nt.querySelector('colgroup');
  if(!ocg||!ncg||ocg.outerHTML!==ncg.outerHTML||el.rows.length!==nt.rows.length)return full();
  for(let r=0;r<nt.rows.length;r++){if(el.rows[r].cells.length!==nt.rows[r].cells.length)return full()}
  for(let r=0;r<nt.rows.length;r++){
    const or=el.rows[r],nr=nt.rows[r];
    syncAttrs(or,nr);
    const ocs=[...or.cells],ncs=[...nr.cells];
    ncs.forEach((nc,c)=>{
      const oc=ocs[c],ni=nc.innerHTML;
      if(oc.tagName===nc.tagName&&oc.__i===ni){
        const no=nc.outerHTML;
        if(oc.__o!==no){syncAttrs(oc,nc);oc.__o=no}
      }else{
        nc.__i=ni;nc.__o=nc.outerHTML;
        oc.replaceWith(nc);
      }
    });
  }
}
// El número real queda en el DOM (lo leen los lectores de pantalla y las pruebas); lo que se ve sube por CSS con data-show.
function tickCounts(){
  ui.cntRaf=0;
  const ps=Object.keys(ui.cnt);
  if(!ps.length)return;
  const now=performance.now();let live=false;
  const tds=$$('#sheet tr.tot td');
  ps.forEach(p=>{
    const c=ui.cnt[p],t=Math.max(0,Math.min(1,(now-c.t0)/CNT_MS));
    const v=Math.round(c.from+(c.to-c.from)*(1-Math.pow(1-t,3)));
    tds.forEach(td=>{
      if(td.dataset.p!==p)return;
      const tv=td.querySelector('.tv.cnt'),pl=td.querySelector('.plus');
      if(tv)tv.dataset.show=String(v);
      if(pl&&!pl.style.animationDelay)pl.style.animationDelay=-Math.round(now-c.t0)+'ms';
    });
    if(t<1)live=true;
  });
  if(live)ui.cntRaf=requestAnimationFrame(tickCounts);
}
function updateDice(){
  const g=G,els=ui.dieEls;
  if(!els.length)return;
  const has=!!(g.dice&&g.dice.length===5);
  const held=effectiveHeld();
  if(!has)clearStamp();
  if((g.seq||0)!==ui.seenSeq){
    ui.seenSeq=g.seq||0;
    clearStamp();
    if(has){
      let rolled=0;
      const isKept=i=>!!((g.roll||0)>1&&g.held&&g.held[i]);
      const total=els.filter((el,i)=>!isKept(i)).length,ms=Math.round(430+total*34);
      els.forEach((el,i)=>{
        if(!isKept(i)){rolled++;tumble(el,()=>(G&&G.dice&&G.dice[i])||0,ms)}
      });
      Sound.roll(rolled,ms);
      maybeStamp(ms+130);
    }
  }
  const mine=canAct();
  els.forEach((el,i)=>{
    const v=has?g.dice[i]:0;
    const isHeld=!!held[i]&&has&&(g.roll||0)<3&&g.status==='playing';
    el.classList.toggle('empty',!v);
    el.classList.toggle('held',isHeld);
    el.setAttribute('aria-pressed',String(isHeld));
    el.setAttribute('aria-label',v?`Dado ${i+1}: ${v}${isHeld?', guardado':''}`:`Dado ${i+1}, sin tirar`);
    el.disabled=!mine||!has||(g.roll||0)>=3;
    if(!el._rolling)setFace(el,v);
  });
}

    return roll>0?`${who} va por la tirada ${roll}.`:`Esperando que ${who} tire.`;
  }
  const combo=roll>0?comboName(g.dice,roll):'';
  const c=combo?`<b>${esc(combo)}.</b> `:'';
  if(roll===0)return 'Tirá los cinco dados.';
  if(ui.selected)return c+'Tocá la casilla de nuevo para soltarla.';

function sheetHTML(){

    g.order.forEach((p,i)=>{
      const sh=sheetOf(g,p),v=sh[c.k],isAct=p===act;
      const cls=(isAct?'act ':'')+(isGone(g,p)?'gone ':'');
      if(v!==undefined){

        const rot=((hash(p+c.k)%7)-3)*0.9;
        const last=(g.evt&&g.evt.pid===p&&g.evt.k===c.k)?' last':'';
        const rp=v>0&&reps[c.k].has(p),cut=rp&&isCut(g,p,c.k),can=rp&&canCut(g,p);
        const flags=`${v>0?'':' cruz'}${rp&&!cut?' rep':''}${cut?' cut':''}${can&&!cut?' mine':''}`;
        let inner;
        if(v>0){
          inner=`<span class="ink" style="--r:${rot.toFixed(1)}deg">${v}</span>`+(cut?'<svg class="tachado over" viewBox="0 0 40 24" aria-hidden="true"><path d="M4 19C14 15 25 9 36 4"/></svg>':'');
          if(can){
            const lab=cut?`Recuperar el ${v} de ${c.n}`:`Tachar el ${v} de ${c.n}: está repetido`;
            inner+=`<button class="cellbtn" data-act="cut" data-p="${esc(p)}" data-k="${c.k}" aria-label="${esc(lab)}"></button>`;
          }
        }else inner='<svg class="tachado" viewBox="0 0 40 24" aria-hidden="true"><path d="M4 19C14 15 25 9 36 4"/></svg><span class="sr">tachado</span>';
        h+=`<td class="${cls}done${fresh}${last}${flags}" style="--pcr:${COLORS_RGB[i%6]}">${inner}</td>`;
      }else if(isAct&&mine&&pot[c.k]!==undefined){
        const pv=pot[c.k],sel=ui.selected===c.k;
        const label=(pv>0?'Anotar '+pv:'Tachar')+' en '+c.n;
        h+=`<td class="${cls}open${pv>0?' pv':''}${sel?' pick':''}"><button class="cellbtn" data-act="pick" data-k="${c.k}" aria-pressed="${sel}" aria-label="${esc(label)}"><span class="ghost${pv>0?' pos':' zero'}">${pv}</span></button></td>`;
      }else h+=`<td class="${cls.trim()}"></td>`;
    });
    h+='</tr>';
  });
  const sub=(label,key,first)=>`<tr class="sub${first?' first':''}"><th scope="row" class="lab">${label}</th>`+g.order.map(p=>{
    const t=parts[p][key];
    return `<td class="${p===act?'act ':''}${isGone(g,p)?'gone ':''}${t>0?'':'z'}">${t}</td>`;
  }).join('')+'</tr>';
  h+=sub('Números','nums',true)+sub('Juegos','jue',false);
  h+='<tr class="tot"><th scope="row" class="lab">Total</th>'+g.order.map((p,i)=>{
    const pts=parts[p].nums+parts[p].jue,gone=isGone(g,p);
    const lead=!!(st&&!gone&&st.lead.has(p));
    let d='';
    if(st&&!gone&&st.diff){
      if(lead)d=st.lead.size>1?'=':(st.gap!==null?'+'+st.gap:'');
      else d='−'+(st.best-pts);
    }
    let say=`${nameOf(p)}: ${pts} puntos`;
    if(lead)say+=st.diff&&st.lead.size===1&&st.gap!==null?`, va ganando por ${st.gap}`:', va ganando';
    else if(d)say+=`, a ${st.best-pts} del primero`;
    const c=ui.cnt[p];
    return `<td class="${p===act?'act ':''}${gone?'gone ':''}${lead?'lead':''}" data-p="${esc(p)}" aria-label="${esc(say)}" style="${px(i)}">`
      +`<b class="tv${c?' cnt':''}"${c?` data-show="${c.to}"`:''}>${pts}</b>`
      +`<i class="df"${d?` data-d="${d}"`:''}>${lead?ICON.crown:''}</i>`
      +(c?`<em class="plus${c.to<c.from?' neg':''}" data-v="${c.to>c.from?'+'+(c.to-c.from):'−'+(c.from-c.to)}"></em>`:'')
      +'</td>';
  }).join('')+'</tr></tbody>';
  return h;
}
function barHTML(){
  const g=G;
  if(g.status==='finished')return '<button class="btn primary grow" data-act="results">Ver resultados</button>';
  const act=activePid();
  if(!canAct())return `<div class="waiting"><span class="pulse"></span> ${ui.spectator?'Mirando · ':''}Esperando a ${esc(nameOf(act))}…</div>`;
  const roll=g.roll||0,left=3-roll,held=effectiveHeld();
  if(roll===0)return '<button class="btn primary grow" data-act="roll">Tirar los dados</button>';
  const pot=potentials(g.dice||[],roll,sheetOf(g,act),g.opts||{});
  const allHeld=held.every(Boolean);
  const sel=ui.selected;
  if(sel&&pot[sel]!==undefined){
    const v=pot[sel];
    let h='';
    if(left>0)h+=`<button class="btn" data-act="roll" ${allHeld?'disabled':''}>Tirar <small>(${left})</small></button>`;
    h+=`<button class="btn ${v>0?'primary':'tachar'} grow" data-act="score">${v>0?'Anotar '+v:'Tachar'} · ${esc(CAT[sel].n)}</button>`;

  }

  return '<div class="waiting"><b>Elegí una casilla de tu columna</b></div>';
}

/* ---- resultados ---- */
// Partidas ganadas en la sala o en el celular (se arrastran de revancha en revancha).
function seriesTotals(g,withCurrent){
  const t={};
  (g.order||[]).forEach(p=>{t[p]=(g.series&&g.series[p])||0});
  if(withCurrent&&g.status==='finished')winnersNow(g).forEach(p=>{if(p in t)t[p]++});
  return t;
}
function seriesHTML(g,withCurrent){
  if((g.n||1)<2)return '';
  const t=seriesTotals(g,withCurrent);
  return alive(g).slice().sort((a,b)=>(t[b]-t[a])||(g.order.indexOf(a)-g.order.indexOf(b)))
    .map(p=>`<span class="sw"><b>${esc(nameOf(p))}</b> ${t[p]}</span>`).join(' ');
}
function resultsHTML(){
  const rows=G.order.map((p,i)=>({p,i,t:pointsOf(G,p),gone:isGone(G,p)})).sort((a,b)=>(a.gone-b.gone)||(b.t-a.t)||(a.i-b.i));
  const winners=winnersNow(G);
  const win=new Set(winners);
  const wn=winners.map(p=>esc(nameOf(p)));
  const pend=G.endReason==='servida'?0:pendingReps(G);
  let title;
  if(G.endReason==='servida')title=`¡Generala servida!<br>Ganó ${wn[0]}`;
  else if(wn.length===1)title=`Ganó ${wn[0]}`;
  else title=`Empate entre ${wn.join(' y ')}`;
  const canAgain=ui.mode==='local'||!ui.spectator;
  return `<div class="result" role="dialog" aria-modal="true" aria-labelledby="rtt">
    <p class="kicker">Fin de la partida</p>
    <h2 id="rtt">${title}</h2>
    ${pend?`<p class="rnote">Hay ${pend} valor${pend>1?'es':''} repetido${pend>1?'s':''} sin tachar. Tocá “Ver la planilla” para tacharlo${pend>1?'s':''}.</p>`:''}
    <ol class="rank">${rows.map(r=>{
      const pos=r.gone?'–':(1+rows.filter(x=>!x.gone&&x.t>r.t).length)+'º';
      return `<li class="${win.has(r.p)?'win':''}"><span class="pos">${pos}</span><span class="rn">${esc(nameOf(r.p))}${r.p===me.pid&&ui.mode==='online'?' (vos)':''}${r.gone?' · se fue':''}</span><span class="pt">${r.t}</span></li>`;
    }).join('')}</ol>
    ${(()=>{const s=seriesHTML(G,true);return s?`<p class="rseries"><span class="rsl">Partidas ganadas</span> ${s}</p>`:''})()}
    <div class="rbtns">
      ${canAgain?'<button class="btn primary" data-act="again">Jugar otra vez</button>':''}
      <button class="btn ghost-dark" data-act="hide-results">Ver la planilla</button>
      <button class="btn ghost-dark" data-act="leave">Salir</button>
    </div>
  </div>`;
}
function updateOverlay(){
  const o=$('#overlay');
  if(!G||ui.screen!=='game'||G.status!=='finished'||ui.hideResults){o.hidden=true;if(ui.lastOverlay){o.innerHTML='';ui.lastOverlay=''}return}

/* ================= acciones del juego ================= */
function setGame(g){
  const prev=G;
  G=g;
  afterGameChange(prev);
  render();
}
function resetTrackers(){
  const g=G;
  ui.seenSeq=g.seq||0;ui.seenEvt=(g.evt&&g.evt.n)||0;ui.seenTurn=null;
  ui.selected=null;ui.heldDirty=false;clearTimeout(ui.heldTimer);
  ui.hideResults=false;ui.prevKeys=null;ui.fresh.clear();ui.lastSheet='';ui.lastBar='';ui.busyUntil=0;ui.botPlan=null;
  ui.prevTot=null;ui.cnt={};clearTimeout(ui.cntT);
  ui.seenReacts={};ui.reactUntil=0;
}
function evtText(g){
  const e=g.evt,c=CAT[e.k];
  if(!c)return '';
  const n=nameOf(e.pid);
  return e.v>0?`${n} anotó ${e.v} en ${c.n}`:`${n} tachó ${c.n}`;
}
function afterGameChange(prev){
  const g=G;
  if(!prev||prev.n!==g.n)resetTrackers();
  if(g.status==='lobby'){
    ui.screen='lobby';
    ui.spectator=ui.mode==='online'&&Net.canWrite===false;
    return;
  }
  stopPlayersSub();
  ui.screen='game';
  ui.spectator=ui.mode==='online'&&!(g.order||[]).includes(me.pid);
  if(prev&&prev.turn!==g.turn){ui.selected=null;ui.heldDirty=false}
  const en=(g.evt&&g.evt.n)||0;
  let scored=false;
  if(en>ui.seenEvt){
    ui.seenEvt=en;
    const e=g.evt,reps=e.k?repeatedIn(g,e.k):new Set(),c=CAT[e.k];
    if(c){Sound.score(e.v);scored=true}
    let msg=((ui.mode==='online'&&e.pid!==me.pid)||(ui.mode==='local'&&botIs(g,e.pid)))?evtText(g):'';
    if(reps.size>0&&c){
      if(ui.mode==='local'){if([...reps].some(p=>!botIs(g,p)))msg=(msg?msg+'. ':'')+'Repetido en '+c.n+': tocá tu valor para tacharlo.'}
      else if(reps.has(me.pid))msg=(msg?msg+'. ':'')+'Tu valor de '+c.n+' está repetido: tocalo para tacharlo.';
    }
    if(msg)toast(msg,4200);
  }
  // fin de la partida: fanfarria para quien ganó, sonido suave para el resto
  if(prev&&prev.n===g.n&&prev.status==='playing'&&g.status==='finished'){
    const wins=ui.mode==='local'||(g.winners||[]).includes(me.pid),n0=g.n;
    setTimeout(()=>{if(G&&G.n===n0&&G.status==='finished'){if(wins)Sound.win();else Sound.end()}},REDUCED?0:(g.endReason==='servida'?1900:750));
  }
  // te toca: solo online, y solo cuando el turno pasa a vos
  const wasMine=!!prev&&prev.n===g.n&&prev.status==='playing'&&Array.isArray(prev.order)&&prev.order[prev.turn]===me.pid;
  if(prev&&ui.mode==='online'&&!ui.spectator&&g.status==='playing'&&activePid()===me.pid&&!wasMine)alertTurn(scored);
  startCutsSub();
  startReactsSub();
  botKick();
}
const BASE_TITLE=document.title;
function setTitleAlert(on){try{document.title=on?'🎲 ¡Te toca! · Generala':BASE_TITLE}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ui.hiddenAt=Date.now();return}
  setTitleAlert(false);
  // al volver tras un rato, las reacciones que se acumularon no se repiten
  if(ui.hiddenAt&&Date.now()-ui.hiddenAt>3000)ui.reactQuiet=Date.now()+2500;
});
function alertTurn(afterScore,nudger){
  ui.alertAt=Date.now();

  if(afterScore&&!REDUCED)setTimeout(()=>Sound.turn(),480);
  else Sound.turn();
  try{if(navigator.vibrate)navigator.vibrate([110,70,110])}catch(e){}
  if(document.hidden){
    setTitleAlert(true);
    const na=window.__notifyApi;
    if(na)na.show(nudger?('⏰ '+nudger+' te apura'):'¡Te toca!','Sala '+(Net.code||'')+': '+(nudger?'te están esperando para tirar.':'tirá los dados.'));
  }

/* ---- reacciones rápidas (solo online) ---- */
function canReact(){return !!G&&ui.mode==='online'&&!ui.spectator&&G.status!=='lobby'&&Array.isArray(G.order)&&G.order.includes(me.pid)&&!isGone(G,me.pid)}
function closeReactTray(){
  const t=$('#rtray'),b=$('#btnReact');
  if(t)t.hidden=true;
  if(b)b.setAttribute('aria-expanded','false');
}
function syncReactCool(){
  const cool=Date.now()<ui.reactUntil;
  $$('#rtray button').forEach(b=>{b.disabled=cool});
  clearTimeout(ui.reactT);
  if(cool)ui.reactT=setTimeout(syncReactCool,Math.max(30,ui.reactUntil-Date.now()+20));
}
function syncReactBtn(){
  const b=$('#btnReact'),gap=$('#reactGap');
  if(!b||!gap)return;
  const ok=canReact();
  b.hidden=!ok;gap.hidden=ok;
  if(!ok)closeReactTray();
}
function showReaction(p,e){
  const layer=$('#reactLayer');
  if(!layer||!G)return;
  const order=G.order||[],i=Math.max(0,order.indexOf(p)),n=Math.max(1,order.length);
  const x=Math.min(86,Math.max(14,(i+0.5)/n*100));
  while(layer.children.length>=8)layer.firstChild.remove();
  const b=document.createElement('div');
  b.className='rb';b.style.setProperty('--x',x+'%');b.style.setProperty('--pc',COLORS[i%6]);
  const em=document.createElement('span');em.className='re';em.textContent=e;
  const nm=document.createElement('span');nm.className='rn';
  const dot=document.createElement('i'),tx=document.createElement('span');tx.textContent=nameOf(p);
  nm.append(dot,tx);b.append(em,nm);layer.append(b);
  setTimeout(()=>b.remove(),REDUCED?2400:3100);
  const live=$('#reactLive');
  if(live)live.textContent=nameOf(p)+': '+((REACTS.find(r=>r.e===e)||{}).t||e);
}
function sendReact(e){
  if(!canReact()||!REACTS.some(r=>r.e===e)||!Net.db||!Net.code)return;
  const now=Date.now();
  if(now<ui.reactUntil)return;
  ui.reactUntil=now+1500;
  // cada jugador escribe solo su propio documento (como los tachados): así no se pisa con quien está tirando los dados
  const old=ui.seenReacts[me.pid],n=Math.max(now,(old&&old.g===G.n?old.n:0)+1);
  const doc={g:G.n||0,n,e};
  ui.seenReacts[me.pid]={g:doc.g,n};   // la mía se muestra ahora; cuando vuelve de la sala no se repite
  Net.reacts=Object.assign({},Net.reacts,{[me.pid]:doc});
  closeReactTray();
  showReaction(me.pid,e);
  syncReactCool();
  const ref=Net.db.doc(`games/${Net.code}/reacts/${me.pid}`);
  Net.reactQ=(Net.reactQ||Promise.resolve()).then(()=>ref.set(doc)).catch(()=>{});
}
function startReactsSub(){
  if(Net.unsubR||!Net.db||!Net.code||ui.mode!=='online')return;
  Net.reactsQuiet=Date.now()+1000;   // lo que ya estaba en la sala al entrar no se repite
  Net.unsubR=Net.db.collection(`games/${Net.code}/reacts`).onSnapshot(qs=>{
    const m={};qs.docs.forEach(d=>{m[d.id]=d.data()});
    Net.reacts=m;
    handleReacts(m);
  },()=>{});
}
function stopReactsSub(){if(Net.unsubR){Net.unsubR();Net.unsubR=null}Net.reacts={};Net.reactQ=null}
function handleReacts(m){
  const g=G;
  if(!g||ui.mode!=='online'||g.status==='lobby')return;
  let shown=0;
  Object.keys(m).forEach(p=>{
    const r=m[p];
    if(!r||typeof r.n!=='number')return;
    const s=ui.seenReacts[p];
    if(s&&s.g===r.g&&r.n<=s.n)return;
    ui.seenReacts[p]={g:r.g,n:r.n};
    if(Date.now()<Net.reactsQuiet||r.g!==(g.n||0))return;
    if(p===me.pid||!REACTS.some(x=>x.e===r.e)||!(g.order||[]).includes(p))return;
    if(Date.now()<ui.reactQuiet)return;      // recién volvió a la app: lo viejo no se repite
    if(shown++>=3)return;
    showReaction(p,r.e);
    // ⏰ avisa como "te toca" a quien tiene el turno, pero no más de una vez cada 8 segundos ni encima de su propio aviso
    const mine=!ui.spectator&&g.status==='playing'&&activePid()===me.pid;
    const nudge=r.e==='⏰'&&mine&&Date.now()-ui.nudgeAt>8000&&Date.now()-ui.alertAt>2000;
    if(nudge){ui.nudgeAt=Date.now();alertTurn(false,nameOf(p))}
    else if(r.e!=='⏰'||!mine)Sound.react();
  });
}
function sendPatch(patch){
  if(!patch||!G)return;
  setGame(merge(G,patch));
  if(ui.mode==='local')persistLocal();
  else if(Net.writer)Net.writer.update(patch).catch(netError);
}
/* ---- turnos de la compu (solo en un celular) ---- */
const botDelay=ms=>window.__BOT_FAST?20:ms;
const isBotTurn=()=>!!(G&&G.status==='playing'&&ui.mode==='local'&&botIs(G,activePid()));
function botKick(){ // cada cambio de la partida programa el siguiente paso de la compu, con pausas para que se vea
  clearTimeout(ui.botT);ui.botT=0;
  if(!isBotTurn())return;
  const roll=G.roll||0,pl=ui.botPlan&&ui.botPlan.seq===(G.seq||0)?ui.botPlan:null;
  ui.botT=setTimeout(botStep,botDelay(roll===0?1000:(pl?850:1400)));
}
function botStep(){
  ui.botT=0;
  if(!isBotTurn())return;
  const g=G,p=activePid(),roll=g.roll||0,seq=g.seq||0;
  const pl=ui.botPlan&&ui.botPlan.seq===seq?ui.botPlan:null;
  if(roll===0){ui.botPlan=null;const patch=actRoll(g,null);if(patch)sendPatch(patch);return}
  if(pl&&pl.act==='roll'){ui.botPlan=null;const patch=actRoll(g,g.held);if(patch)sendPatch(patch);return}
  if(pl&&pl.act==='score'){ui.botPlan=null;const patch=actScore(g,pl.k);if(patch)sendPatch(patch);return}
  const d=botPlan(g.dice,roll,sheetOf(g,p),g.opts||{},g.botLevel);
  if(d.act==='roll'){ui.botPlan={seq,act:'roll'};sendPatch({held:d.hold})}   // primero se ve qué guarda y después tira
  else{ui.botPlan={seq,act:'score',k:d.k};botKick()}
}
function doRoll(){
  if(!canAct()||Date.now()<ui.busyUntil)return;
  const patch=actRoll(G,effectiveHeld());
  if(!patch)return;
  ui.busyUntil=Date.now()+650;
  ui.selected=null;ui.heldDirty=false;clearTimeout(ui.heldTimer);
  sendPatch(patch);
}
function toggleHold(i){
  if(!canAct())return;
  const roll=G.roll||0;
  if(roll<1||roll>=3||ui.dieEls[i]._rolling)return;
  const h=effectiveHeld().slice();h[i]=!h[i];
  if(ui.mode==='local'){sendPatch({held:h});return}
  ui.heldLocal=h;ui.heldDirty=true;
  clearTimeout(ui.heldTimer);ui.heldTimer=setTimeout(flushHeld,350);
  render();
}
function flushHeld(){
  if(!ui.heldDirty||!G)return;
  const h=ui.heldLocal;ui.heldDirty=false;
  sendPatch({held:h});
}
function pickCell(k){
  if(!canAct()||(G.roll||0)<1)return;

  render();
}
function doScore(){
  const k=ui.selected;
  if(!k||!canAct())return;
  const patch=actScore(G,k);
  if(!patch)return;
  ui.selected=null;ui.heldDirty=false;clearTimeout(ui.heldTimer);ui.busyUntil=0;
  sendPatch(patch);
}
function toggleCut(p,k){
  if(!G||!canCut(G,p)||!repeatedIn(G,k).has(p))return;

  if(ui.mode==='local'){sendPatch({cuts:{[p]:{[k]:now}}});return}

/* ================= conexión online ================= */
function ensurePid(){
  if(me.pid)return;
  let id=Net.uid;
  if(!id){
    id=store.get('pid');
    if(!id){id='g'+Array.from({length:10},()=>ALPHABET[randInt(ALPHABET.length)]).join('');store.set('pid',id)}
  }
  me.pid=String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,100);
}
async function initNet(roomHint){
  let tries=0;
  while(!(window.claude&&typeof window.claude.use==='function')&&tries<15){await sleep(200);tries++}
  if(!(window.claude&&typeof window.claude.use==='function')){Net.status='offline';render();return}
  const timeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
  try{
    const [db,user]=await Promise.all([
      timeout(Promise.resolve(window.claude.use('db')).catch(()=>null),12000),
      timeout(Promise.resolve(window.claude.use('user')).catch(()=>null),12000)
    ]);
    Net.db=db||null;Net.user=user||null;
    if(user){
      try{Net.uid=await user.id()}catch(e){}
      try{Net.canWrite=await user.can('data.write')}catch(e){}
    }
    Net.status=db?'ready':'offline';
  }catch(e){Net.status='offline'}
  render();
  if(Net.status==='ready')autoRejoin(roomHint);
}
async function autoRejoin(hint){
  if(ui.mode==='local'||Net.code)return;
  const code=String(hint||store.get('room')||'').toUpperCase();
  const name=(ui.name||'').trim();
  if(!/^[A-Z0-9]{4}$/.test(code)||!name)return;
  try{
    ensurePid();
    const s=await Net.db.doc('games/'+code).get();
    if(!s.exists||s.data().status==='finished'){store.del('room');return}
    const g=s.data();
    if(g.status==='playing'){if(!(g.order||[]).includes(me.pid))return}
    else{const pd=await Net.db.doc(`games/${code}/players/${me.pid}`).get();if(!pd.exists)return}
    if(ui.mode==='local'||Net.code)return;
    me.name=name;ui.mode='online';
    subscribe(code);
  }catch(e){}
}
function netError(e){
  setBusy(false);
  const c=e&&e.code;
  let m='No se pudo conectar. Probá de nuevo.';
  if(c==='invalid_argument')m='No se pudo guardar. Puede que la sala ya no exista o que se haya cortado la conexión.';
  else if(c==='resource_exhausted')m='Demasiadas acciones juntas. Esperá un momento y probá de nuevo.';
  else if(c==='quota_exceeded')m='Se llenó el espacio de la página. Avisale a quien la creó.';
  else if(c==='revoked')m='Perdiste el acceso a esta página.';
  toast(m,4200);
  if(Net.gref&&c!=='revoked'){Net.gref.get().then(s=>{if(s.exists)setGame(s.data())}).catch(()=>{})}
}
function makeWriter(ref){
  let busy=false;const q=[];
  async function pump(){
    if(busy||!q.length)return;
    busy=true;
    let op=q.shift();
    if(op.type==='update'){
      while(q.length&&q[0].type==='update'){const n=q.shift();op={type:'update',data:merge(op.data,n.data),ws:op.ws.concat(n.ws)}}
    }
    let err=null;
    for(let a=0;a<4;a++){
      try{
        if(op.type==='set')await ref.set(op.data);else await ref.update(op.data);
        err=null;break;
      }catch(e){
        err=e;
        const c=e&&e.code;
        if(c==='invalid_argument'||c==='revoked'||c==='quota_exceeded')break;
        await sleep(400+Math.random()*600*(a+1));
      }
    }
    op.ws.forEach(w=>err?w.rej(err):w.res());
    busy=false;pump();
  }
  const push=(type,data)=>new Promise((res,rej)=>{q.push({type,data,ws:[{res,rej}]});pump()});
  return {update:d=>push('update',d),set:d=>push('set',d)};
}
function setHash(code){try{location.hash='sala-'+code}catch(e){}}
function clearHash(){try{if(/^#sala-/.test(location.hash))location.hash=''}catch(e){}}
function subscribe(code){
  unsubscribe();
  Net.code=code;Net.players=[];G=null;ui.mode='online';
  Net.gref=Net.db.doc('games/'+code);
  Net.writer=makeWriter(Net.gref);
  const t=setTimeout(()=>{if(!G){setBusy(false);toast('Todavía no hay respuesta de la sala. Revisá tu conexión.',4200)}},10000);
  Net.unsubG=Net.gref.onSnapshot(snap=>{clearTimeout(t);onGame(snap)},e=>{clearTimeout(t);netError(e)});
  startPlayersSub();
  setHash(code);
}
function startPlayersSub(){
  if(Net.unsubP||!Net.db||!Net.code)return;
  Net.unsubP=Net.db.collection(`games/${Net.code}/players`).onSnapshot(qs=>{
    Net.players=qs.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    if(ui.screen==='lobby')render();
  },()=>{});
}
function stopPlayersSub(){if(Net.unsubP){Net.unsubP();Net.unsubP=null}}
function startCutsSub(){
  if(Net.unsubC||!Net.db||!Net.code||ui.mode!=='online')return;
  Net.unsubC=Net.db.collection(`games/${Net.code}/cuts`).onSnapshot(qs=>{
    const m={};qs.docs.forEach(d=>{m[d.id]=d.data()});
    Net.cuts=m;
    if(ui.screen==='game')render();
  },()=>{});
}
function stopCutsSub(){if(Net.unsubC){Net.unsubC();Net.unsubC=null}Net.cuts={}}
function unsubscribe(){
  if(Net.unsubG){Net.unsubG();Net.unsubG=null}
  stopPlayersSub();stopCutsSub();stopReactsSub();Net.writer=null;Net.gref=null;Net.cutQ=null;
}
function onGame(snap){
  setBusy(false);
  if(!snap.exists){
    if(snap.metadata&&snap.metadata.fromCache)return;
    if(Net.code&&G){toast('La sala ya no existe.');leaveRoom(true)}
    return;
  }
  setGame(snap.data());
}
async function leaveRoom(silent){
  const code=Net.code,db=Net.db,wasLobby=!!G&&G.status==='lobby',host=!!G&&G.hostId===me.pid;
  const players=Net.players.slice();
  unsubscribe();store.del('room');clearHash();
  G=null;Net.code=null;Net.players=[];ui.mode=null;ui.spectator=false;
  goHome();
  try{
    if(!silent&&db&&code&&wasLobby){
      if(host){
        for(const p of players)await db.doc(`games/${code}/players/${p.id}`).delete();
        await db.doc('games/'+code).delete();
      }else await db.doc(`games/${code}/players/${me.pid}`).delete();
    }
  }catch(e){}
}
async function createRoom(){
  const name=cleanName();
  if(!name){toast('Escribí tu nombre primero.');focusName();return}
  if(Net.status!=='ready'||Net.canWrite===false||ui.busy)return;
  setBusy(true);
  try{
    ensurePid();me.name=name;ui.name=name;store.set('name',name);
    let code='',free=false;
    for(let t=0;t<8&&!free;t++){
      code=genCode();
      const s=await Net.db.doc('games/'+code).get();
      free=!s.exists;
    }
    if(!free)throw {code:'unavailable'};
    await Net.db.doc('games/'+code).set({code,hostId:me.pid,status:'lobby',opts:{servida:'win'},n:0,createdAt:Date.now()});
    await Net.db.doc(`games/${code}/players/${me.pid}`).set({id:me.pid,name,joinedAt:Date.now()});
    store.set('room',code);
    subscribe(code);
  }catch(e){netError(e)}
}
async function joinRoom(code){
  const name=cleanName();
  if(!name){toast('Escribí tu nombre primero.');focusName();return}
  if(Net.status!=='ready'||ui.busy)return;
  setBusy(true);
  try{
    const snap=await Net.db.doc('games/'+code).get();
    if(!snap.exists){setBusy(false);toast('No encontramos esa sala. Revisá el código.');return}
    const g=snap.data();
    ensurePid();me.name=name;ui.name=name;store.set('name',name);
    if(g.status==='lobby'&&Net.canWrite!==false){
      const list=await Net.db.collection(`games/${code}/players`).get();
      const mine=list.docs.find(d=>d.id===me.pid);
      if(!mine&&list.size>=MAX_PLAYERS){setBusy(false);toast(`La sala está llena (máximo ${MAX_PLAYERS}).`);return}
      await Net.db.doc(`games/${code}/players/${me.pid}`).set({id:me.pid,name,joinedAt:mine?((mine.data().joinedAt)||Date.now()):Date.now()});
    }
    store.set('room',code);
    subscribe(code);
  }catch(e){netError(e)}
}
function startOnline(){
  if(!G||G.status!=='lobby'||G.hostId!==me.pid)return;
  const ps=Net.players.slice(0,MAX_PLAYERS);
  if(!ps.length)return;
  const order=shuffle(ps.map(p=>p.id)),names={};
  ps.forEach(p=>{names[p.id]=p.name});
  sendPatch({status:'playing',order,names,turn:0,roll:0,dice:[],held:NO_HOLD(),seq:0,evt:{n:0},winners:[],n:1});
}
async function shareRoom(){
  const code=Net.code||'';
  const url=location.origin+location.pathname+'#sala-'+code;
  const text='Jugá a la Generala conmigo. Código de la sala: '+code;
  try{
    if(navigator.share){await navigator.share({title:'Generala',text,url});return}
    await navigator.clipboard.writeText(text+'\n'+url);toast('Invitación copiada. Pegala en un chat.');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    toast('No se pudo compartir. El código es '+code+'.');
  }
}
async function copyCode(){
  try{await navigator.clipboard.writeText(Net.code||'');toast('Código copiado.')}
  catch(e){toast('No se pudo copiar. El código es '+(Net.code||'')+'.')}
}

/* ================= eventos ================= */
const ACT={
  hero(){heroRoll()},
  create(){createRoom()},
  join(){
    const code=(($('#codeInput')||{}).value||'').toUpperCase();
    if(code.length!==4){toast('El código tiene 4 letras o números.');return}
    joinRoom(code);
  },
  setup(){ui.screen='setup';render()},
  'back-home'(){goHome()},
  'add-player'(){
    if(ui.setupNames.length<MAX_PLAYERS){ui.setupNames.push('');ui.setupBots.push(false);renderSetupList();updateSetup();const l=$('#sn'+(ui.setupNames.length-1));if(l)l.focus()}
  },
  'rm-player'(el){ui.setupNames.splice(+el.dataset.i,1);ui.setupBots.splice(+el.dataset.i,1);renderSetupList();updateSetup()},
  'toggle-bot'(el){const i=+el.dataset.i;ui.setupBots[i]=!ui.setupBots[i];renderSetupList();updateSetup()},
  'bot-level'(el){ui.botLevel=el.dataset.v==='easy'?'easy':'normal';updateSetup()},
  'opt-local'(el){ui.opts.servida=el.dataset.v;updateSetup()},
  'start-local'(){startLocal()},
  'resume-local'(){resumeLocal()},
  opt(el){if(G&&G.status==='lobby'&&G.hostId===me.pid)sendPatch({opts:{servida:el.dataset.v}})},
  'start-online'(){startOnline()},
  copy(){copyCode()},
  share(){shareRoom()},
  install(){if(window.__install)window.__install()},
  'install-help'(){openModal('Instalar la app',INSTALL_HTML)},
  retry(){Net.status='connecting';render();initNet()},
  roll(){doRoll()},
  hold(el){toggleHold(+el.dataset.i)},
  pick(el){pickCell(el.dataset.k)},
  score(){doScore()},
  cut(el){toggleCut(el.dataset.p,el.dataset.k)},
  sound(){toggleSound()},
  async notify(){
    const na=window.__notifyApi;if(!na)return;
    closeModal();
    if(na.state()==='on'){na.disable();toast('Aviso de turno desactivado.');return}
    const r=await na.enable();
    toast(r==='on'?'Listo: te aviso cuando te toque.':'No se activó: el celular no dio permiso para las notificaciones.',3600);
  },
  menu(){closeReactTray();openMenu()},
  'react-menu'(){
    const t=$('#rtray'),b=$('#btnReact');
    if(!t||!canReact())return;
    const open=t.hidden;
    t.hidden=!open;
    if(b)b.setAttribute('aria-expanded',String(open));
    if(open)syncReactCool();
  },
  react(el){sendReact(el.dataset.e)},
  rules(){openModal('Cómo se juega',RULES_HTML)},
  leave(){askLeave()},
  kick(el){askKick(el.dataset.p)},
  again(){playAgain()},
  results(){ui.hideResults=false;updateOverlay()},
  'hide-results'(){ui.hideResults=true;updateOverlay()},
  'close-modal'(){closeModal()},
  'confirm-yes'(){const f=ui.confirmFn;ui.confirmFn=null;closeModal();if(f)f()}
};
document.addEventListener('click',e=>{
  const rt=$('#rtray');
  if(rt&&!rt.hidden&&!e.target.closest('#rtray,#btnReact'))closeReactTray();
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el,e);
});
document.addEventListener('pointerdown',()=>{if(Sound.on)Sound.unlock()},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#modal').hidden)closeModal();
  else closeReactTray();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nameInput'){ui.name=t.value;store.set('name',t.value)}
  else if(t.id==='codeInput'){
    const v=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
    if(v!==t.value)t.value=v;
  }else if(t.classList.contains('input')&&t.dataset.i!==undefined&&ui.screen==='setup'){
    ui.setupNames[+t.dataset.i]=t.value;
  }
});
window.addEventListener('hashchange',()=>{
  const m=/^#sala-([A-Za-z0-9]{4})$/.exec(location.hash||'');
  const c=$('#codeInput');
  if(m&&c&&ui.screen==='home')c.value=m[1].toUpperCase();
});

/* ================= arranque ================= */
function start(data){
  data=data||{};
  if(data.name&&!ui.name)ui.name=data.name;
  if(data.local&&Array.isArray(data.local.order)&&data.local.names){
    ui.mode='local';setGame(data.local);
  }else render();
  initNet(data.room);
}
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function'){
  hot.snapshot(()=>({name:ui.name,local:ui.mode==='local'&&G&&G.status==='playing'?G:null,room:Net.code||null}));
}
if(hot&&typeof hot.ready==='function')hot.ready(start);
else start((hot&&hot.data)||{});

// ganchos para pruebas
window.__G={CUBE_END,REACTS,showReaction,sendReact,canReact,repeatedIn,pointsOf,partsOf,standing,sheetHTML,catComplete,winnersNow,seriesTotals,alertTurn,botPlan,botIs,Sound,loadLocal:(g)=>{ui.mode='local';G=null;setGame(g)},MAX_PLAYERS,potentials,isEsc,isFull,isPoker,isGenerala,comboName,actRoll,actScore,actRemove,newGameDoc,merge,total,filled,CATS,
  state:()=>({G,me:{pid:me.pid,name:me.name},screen:ui.screen,mode:ui.mode,selected:ui.selected,spectator:ui.spectator,net:{status:Net.status,code:Net.code,canWrite:Net.canWrite,players:Net.players,cuts:Net.cuts,reacts:Net.reacts}})};
})();
